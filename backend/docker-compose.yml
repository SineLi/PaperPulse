services:
  postgres:
    image: postgres:16
    container_name: paperpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperpulse}
      POSTGRES_USER: ${POSTGRES_USER:-paperpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paperpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: paperpulse_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - paperpulse_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paperpulse_pgdata:
  paperpulse_redisdata: