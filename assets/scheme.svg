<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #E6EDF3; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #C9D1D9; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #7A8490; letter-spacing: 2px; }
      
      /* 文字遮罩，保持线条不穿透文字 */
      .label-mask-base { stroke: #0D1117; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke fill; }
      .label-mask-backend { stroke: #111820; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke fill; }
    </style>

    <!-- 高级柔和阴影滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- 锐利箭头标记 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 L 2 5 z" fill="#58A6FF" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 L 2 5 z" fill="#A371F7" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 L 2 5 z" fill="#D29922" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 L 2 5 z" fill="#3FB950" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 L 2 5 z" fill="#F78166" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1060" height="360" fill="#0D1117" rx="16" />

  <!-- ==================== 后端集群边界 ==================== -->
  <rect x="370" y="30" width="650" height="300" fill="#111820" stroke="#30363D" stroke-width="2" stroke-dasharray="8 6" rx="16" />
  <!-- <text x="695" y="55" class="zone-title" text-anchor="middle">PAPERPULSE BACKEND INFRASTRUCTURE</text> -->


  <!-- ==================== 极简数据流连线 ==================== -->

  <!-- ① Journals -> Fetcher -->
  <path d="M 260 115 L 395 115" fill="none" stroke="#A371F7" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <text x="327" y="108" text-anchor="middle" class="label label-mask-base" fill="#A371F7">① 定时抓取</text>

  <!-- ② Fetcher -> LLM -->
  <path d="M 620 115 L 755 115" fill="none" stroke="#D29922" stroke-width="2.5" marker-end="url(#arrow-yellow)" />
  <text x="687" y="108" text-anchor="middle" class="label label-mask-backend" fill="#D29922">② AI 提炼总结</text>

  <!-- ③ LLM -> DB -->
  <path d="M 870 160 L 870 215" fill="none" stroke="#F78166" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <text x="885" y="192" text-anchor="start" class="label label-mask-backend" fill="#F78166">③ 结构化入库</text>

  <!-- ④ App -> API (请求) -->
  <path d="M 260 250 L 395 250" fill="none" stroke="#58A6FF" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="327" y="243" text-anchor="middle" class="label label-mask-base" fill="#58A6FF">④ 获取文献流</text>

  <!-- ⑤ API -> DB (查询) -->
  <path d="M 620 265 L 755 265" fill="none" stroke="#3FB950" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="687" y="258" text-anchor="middle" class="label label-mask-backend" fill="#3FB950">⑤ 鉴权与检索</text>

  <!-- ⑥ API -> App (返回) -->
  <path d="M 395 280 L 260 280" fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <text x="327" y="300" text-anchor="middle" class="label label-mask-base" fill="#58A6FF">⑥ 返回瀑布流</text>


  <!-- ==================== 极简模块卡片 ==================== -->

  <!-- [左上] 顶级期刊源 -->
  <g transform="translate(50, 80)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#8B949E" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <text x="55" y="40" class="title">顶级学术期刊源</text>
  </g>

  <!-- [中上] 抓取引擎 -->
  <g transform="translate(410, 80)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#A371F7" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A371F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"></rect>
      <circle cx="12" cy="5" r="2"></circle>
      <path d="M12 7v4"></path>
      <line x1="8" y1="16" x2="8" y2="16"></line>
      <line x1="16" y1="16" x2="16" y2="16"></line>
    </svg>
    <text x="55" y="40" class="title">RSS/爬虫获取摘要</text>
  </g>

  <!-- [右上] LLM 分析 -->
  <g transform="translate(770, 80)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#D29922" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4"></path>
      <path d="M12 18v4"></path>
      <path d="M4.93 4.93l2.83 2.83"></path>
      <path d="M16.24 16.24l2.83 2.83"></path>
      <path d="M2 12h4"></path>
      <path d="M18 12h4"></path>
    </svg>
    <text x="55" y="40" class="title">大模型分析引擎</text>
  </g>

  <!-- [右下] 数据库 -->
  <g transform="translate(770, 230)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#F78166" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F78166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
      <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
    </svg>
    <text x="55" y="40" class="title">Postgres &amp; Redis</text>
  </g>

  <!-- [中下] FastAPI -->
  <g transform="translate(410, 230)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#3FB950" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
      <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
      <line x1="6" y1="6" x2="6.01" y2="6"></line>
      <line x1="6" y1="18" x2="6.01" y2="18"></line>
    </svg>
    <text x="55" y="40" class="title">FastAPI 核心网关</text>
  </g>

  <!-- [左下] 移动端 App -->
  <g transform="translate(50, 230)" filter="url(#shadow)">
    <rect width="210" height="70" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="10" />
    <rect x="-2" y="15" width="5" height="40" fill="#58A6FF" rx="2" />
    <svg x="18" y="23" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <text x="55" y="40" class="title">Flutter 客户端</text>
  </g>

</svg>