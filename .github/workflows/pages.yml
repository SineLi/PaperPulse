name: Deploy Web to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 3.38.7
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Compute base href
        id: base-href
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Flutter Web
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && \
             [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
            exit 1
          fi
          flutter build web \
            --release \
            --build-name "${version}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --base-href "${{ steps.base-href.outputs.value }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend_app/build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
