name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend_app/**"
      - "VERSION"
      - "scripts/version.py"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - "frontend_app/**"
      - "VERSION"
      - "scripts/version.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-checks:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project version
        run: python scripts/version.py check

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall app db services utils scheduler.py run.py

      - name: FastAPI import smoke test
        run: python -c "from app.main import app; print(f'Loaded {len(app.routes)} routes')"

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze

