name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build Frontend Release Assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 3.38.7
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore Android signing files
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Android signing secrets are not fully configured."
            exit 1
          fi

          mkdir -p android/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystores/paperpulse-release.jks

          cat > android/key.properties <<EOF
          storeFile=keystores/paperpulse-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          build_name="${version%%+*}"
          build_number="${version#*+}"

          if [ "${build_number}" = "${version}" ]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${tag_version%%+*}" != "${build_name}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
              exit 1
            fi
            build_number="${tag_version#*+}"

            if [ "${build_number}" = "${tag_version}" ]; then
              build_number="${GITHUB_RUN_NUMBER}"
            fi
          fi

          flutter build apk \
            --release \
            --split-per-abi \
            --build-name "${build_name}" \
            --build-number "${build_number}"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperpulse-release-assets
          path: frontend_app/dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: paperpulse-release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
