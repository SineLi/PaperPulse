name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build Frontend Release Assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          flutter build apk --release --split-per-abi --build-name "${version}"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperpulse-release-assets
          path: frontend_app/dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: paperpulse-release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
